- tapOn:
    point: 16%,39%
- extendedWaitUntil:
    visible: Check receipt
    timeout: 15000
- tapOn: Check receipt
- extendedWaitUntil:
    visible: 3 items to review
    timeout: 15000
- assertNotVisible: Reviewed \(.*\)
