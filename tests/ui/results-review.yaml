- assertVisible: 2 items to review
- assertVisible: Reviewed \(1\)
- assertNotVisible: Move Muffin Mix 500g back to review
- takeScreenshot: docs/ui-review/results-v1.1/02-mixed
- tapOn: View receipt
- assertVisible: Your Receipt
- tapOn: Zoom into receipt
- tapOn: Reset receipt zoom
- tapOn: Back
- assertVisible: 2 items to review
- assertVisible: Reviewed \(1\)
- tapOn: Mark Chk Enchilada 500g as looks good
- assertVisible: 1 item to review
- tapOn: Mark Pancake Choc 325g as looks good
- assertVisible: All items reviewed
- assertVisible: You've checked all repeated items on this receipt.
- assertVisible: Reviewed \(3\)
